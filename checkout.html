<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>NovaCart Checkout</title>
  <link rel="stylesheet" href="checkout.css">
</head>

<body>
  <header class="checkout-header">
    <a href="index.html">← Continue shopping</a>
    <h1>NovaCart Checkout</h1>
  </header>

  <main class="checkout-layout">
    <section class="checkout-form-card">
      <h2>Delivery details</h2>

      <form id="checkoutForm">
        <div class="form-group">
          <label for="customerName">Full name</label>
          <input
            type="text"
            id="customerName"
            name="customerName"
            autocomplete="name"
            required
          >
        </div>

        <div class="form-group">
          <label for="customerPhone">Phone number</label>
          <input
            type="tel"
            id="customerPhone"
            name="customerPhone"
            autocomplete="tel"
            pattern="[0-9]{10}"
            maxlength="10"
            inputmode="numeric"
            title="Phone number must contain exactly 10 digits."
            required
          >
        </div>

        <div class="form-group">
          <label for="customerAddress">Full address</label>
          <textarea
            id="customerAddress"
            name="customerAddress"
            autocomplete="street-address"
            rows="3"
            required
          ></textarea>
        </div>

        <div class="form-group">
          <label for="customerCity">City</label>
          <input
            type="text"
            id="customerCity"
            name="customerCity"
            autocomplete="address-level2"
            required
          >
        </div>

        <div class="form-group">
          <label for="customerPincode">PIN code</label>
          <input
            type="text"
            id="customerPincode"
            name="customerPincode"
            autocomplete="postal-code"
            pattern="[0-9]{6}"
            maxlength="6"
            inputmode="numeric"
            title="PIN code must contain exactly 6 digits."
            required
          >
        </div>

        <div class="payment-method">
          <strong>Payment method</strong>
          <p>Cash on Delivery (COD)</p>
        </div>

        <button type="submit" id="placeOrderButton">
          Place order
        </button>
      </form>

      <section id="orderConfirmation" hidden></section>
    </section>

    <aside class="order-summary-card">
      <h2>Order summary</h2>
      <div id="checkoutItems"></div>
      <h3 id="checkoutTotal">Total: ₹0</h3>
    </aside>
  </main>

  <script src="checkout.js"></script>
</body>
</html>
